<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart rate camera</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Heart rate from your webcam</h1>
      <p>Reads pulse from your face. Runs in the browser. Nothing is sent to a server.</p>
    </header>

    <main>
      <div id="stage">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
        <div id="overlay">
          <div class="bpm-display" id="bpm">-- BPM</div>
          <div class="status-display" id="status">Click Start</div>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn">Start camera</button>
        <button id="stopBtn" class="secondary" disabled>Stop</button>
      </div>
    </main>

    <footer>
      <p class="privacy">Not a medical device.</p>
      <p>Sit still, face the camera, wait about 8 seconds.</p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
